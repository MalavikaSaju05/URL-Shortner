<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URL Shortener</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            font-family: 'Inter', sans-serif;

            background:
                radial-gradient(circle at top left, #5b21b6 0%, transparent 30%),
                radial-gradient(circle at bottom right, #2563eb 0%, transparent 30%),
                linear-gradient(135deg, #0f172a, #111827, #020617);

            color: white;
        }

        .background-blur {

            position: absolute;

            width: 400px;

            height: 400px;

            background: rgba(59, 130, 246, 0.2);

            filter: blur(120px);

            border-radius: 50%;

            top: -100px;

            left: -100px;

            z-index: 0;
        }

        .background-blur-2 {

            position: absolute;

            width: 350px;

            height: 350px;

            background: rgba(168, 85, 247, 0.2);

            filter: blur(120px);

            border-radius: 50%;

            bottom: -100px;

            right: -100px;

            z-index: 0;
        }

        .glass-card {

            position: relative;

            z-index: 2;

            width: 90%;

            max-width: 600px;

            padding: 45px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.18);

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.08);

            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {

            font-size: 2.5rem;

            font-weight: 700;

            margin-bottom: 10px;

            text-align: center;
        }

        .subtitle {

            text-align: center;

            color: rgba(255,255,255,0.7);

            margin-bottom: 35px;

            font-size: 1rem;
        }

        .input-group-custom {

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 18px;

            padding: 10px;

            margin-bottom: 25px;
        }

        .form-control {

            background: transparent !important;

            border: none !important;

            color: white !important;

            font-size: 1rem;

            box-shadow: none !important;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .shorten-btn {

            width: 100%;

            padding: 15px;

            border-radius: 16px;

            border: none;

            font-weight: 600;

            font-size: 1rem;

            background: linear-gradient(135deg, #3b82f6, #8b5cf6);

            color: white;

            transition: all 0.3s ease;
        }

        .shorten-btn:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 25px rgba(59,130,246,0.4);
        }

        .result-card {

            margin-top: 28px;

            padding: 20px;

            border-radius: 20px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.1);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .short-link {

            color: #93c5fd;

            text-decoration: none;

            word-break: break-all;

            font-weight: 500;
        }

        .copy-btn {

            border: none;

            padding: 10px 18px;

            border-radius: 12px;

            background: rgba(255,255,255,0.12);

            color: white;

            transition: all 0.3s ease;

            white-space: nowrap;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .dashboard-btn {

            margin-top: 22px;

            width: 100%;

            border-radius: 16px;

            padding: 14px;

            border: 1px solid rgba(255,255,255,0.15);

            background: rgba(255,255,255,0.06);

            color: white;

            text-decoration: none;

            display: inline-flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            transition: all 0.3s ease;
        }

        .dashboard-btn:hover {

            background: rgba(255,255,255,0.12);

            color: white;
        }

        .icon-row {

            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 22px;

            font-size: 1.8rem;

            color: rgba(255,255,255,0.65);
        }

        .icon-row i {
            transition: all 0.3s ease;
        }

        .icon-row i:hover {
            transform: scale(1.15);
            color: white;
        }

        @media (max-width: 768px) {

            .glass-card {
                padding: 30px 22px;
            }

            .title {
                font-size: 2rem;
            }

            .result-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .copy-btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

    <div class="background-blur"></div>

    <div class="background-blur-2"></div>

    <div class="glass-card">

        <h1 class="title">
            <i class="fa-solid fa-link"></i>
            URL Shortener
        </h1>

        <p class="subtitle">
            Fast. Minimal. Beautiful.
        </p>

        <form method="POST">

            <div class="input-group-custom">

                <input
                    type="text"
                    name="url"
                    placeholder="Paste your long URL here..."
                    required
                    class="form-control"
                >

            </div>

            <button
                type="submit"
                class="shorten-btn"
            >
                Shorten URL
            </button>

        </form>

        {% if short_url %}

        <div class="result-card" id="resultCard">

            <div>

                <p style="margin-bottom: 6px; color: rgba(255,255,255,0.6);">
                    Your shortened link
                </p>

                <a
                    href="{{ short_url }}"
                    target="_blank"
                    class="short-link"
                    id="shortUrl"
                >
                    {{ short_url }}
                </a>

            </div>

            <button
                class="copy-btn"
                onclick="copyLink()"
                id="copyButton"
            >
                <i class="fa-regular fa-copy"></i>
                Copy
            </button>

        </div>

        {% endif %}

        <a
            href="/dashboard"
            class="dashboard-btn"
        >
            <i class="fa-solid fa-chart-line"></i>
            Open Analytics Dashboard
        </a>

        <div class="icon-row">

            <i class="fa-brands fa-google"></i>
            <i class="fa-brands fa-youtube"></i>
            <i class="fa-brands fa-github"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-amazon"></i>

        </div>

    </div>

    <script>

        function copyLink() {

            const shortUrl = document.getElementById('shortUrl').innerText;

            navigator.clipboard.writeText(shortUrl);

            const button = document.getElementById('copyButton');

            button.innerHTML = '<i class="fa-solid fa-check"></i> Copied';

            button.style.background = 'rgba(34,197,94,0.25)';

            setTimeout(() => {

                button.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';

                button.style.background = 'rgba(255,255,255,0.12)';

            }, 2000);
        }

    </script>

</body>

</html>
